# Optional: serve the live dashboard (saw dashboard --serve) from a container
# instead of a local bun. Nothing else in the workflow needs Docker.
#   docker compose up        then open http://127.0.0.1:4173/
# The repo is mounted read-only; the port is published on 127.0.0.1 only.
services:
  dashboard:
    # oven/bun:1.3.11-alpine, pinned by digest.
    image: oven/bun@sha256:7ed9f74c326d1c260abe247ac423ccbf5ac92af62bb442d515d1f92f21e8ea9b
    command: ["bun", "cli/src/main.ts", "dashboard", "--serve", "--port", "4173"]
    working_dir: /repo
    volumes:
      - .:/repo:ro
    environment:
      # Inside the container only: bind 0.0.0.0 so the published port reaches it.
      SAW_DASHBOARD_IN_CONTAINER: "1"
    ports:
      - "127.0.0.1:4173:4173"
    user: bun
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

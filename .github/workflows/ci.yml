name: ci
on:
  push:
    branches: [main, release]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Only `release` and `hotfix/*` merge into main; everything else targets `release`.
  merge-source:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: main takes release or hotfix/* only
        shell: bash
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          if [[ "$BASE" != "main" ]]; then echo "base ${BASE:-none}: no restriction"; exit 0; fi
          if [[ "$HEAD" == "release" || "$HEAD" =~ ^hotfix/[A-Za-z0-9._-]+$ ]]; then echo "$HEAD -> main ok"; exit 0; fi
          echo "::error::$HEAD cannot merge into main. Target the release branch, or name it hotfix/<desc> for a hotfix."
          exit 1
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Lints workflow files (expression injection, typos, shellcheck on run: blocks).
      - name: actionlint
        # Official image by the actionlint author. TODO: pin by digest (rhysd/actionlint:1.7.12@sha256:...).
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        # No Linux leg until Claude Code runs there for this workflow.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun run test
      - run: bun cli/src/main.ts doctor
      - run: bun cli/src/main.ts deps verify
      - run: bun cli/src/main.ts mods check
      # Release sanitisation: no secrets, home paths or emails in published files.
      - run: bun cli/src/main.ts sanitize
      # Agent adapters smoke test: a fresh project set up for every agent reads AGENTS.md.
      - name: agent adapters smoke test
        shell: bash
        run: |
          dir="$RUNNER_TEMP/smoke" && mkdir -p "$dir" && cd "$dir" && git init -q
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" init --agents codex,cursor,gemini
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" agents check --set 'agents.enabled=["claude","codex","cursor","gemini"]'

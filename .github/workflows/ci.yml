name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun test
      - run: bun cli/src/main.ts doctor
      - run: bun cli/src/main.ts deps verify
      # Tier 2 smoke test: a fresh project set up for every agent reads AGENTS.md.
      - name: agent adapters smoke test
        shell: bash
        run: |
          dir="$RUNNER_TEMP/smoke" && mkdir -p "$dir" && cd "$dir" && git init -q
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" init --agents codex,cursor,gemini
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" agents check --set 'agents.enabled=["claude","codex","cursor","gemini"]'

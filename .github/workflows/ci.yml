name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # Lints workflow files (expression injection, typos, shellcheck on run: blocks).
      - name: actionlint
        shell: bash
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
  test:
    timeout-minutes: 15
    strategy:
      matrix:
        # No Linux leg until Claude Code runs there for this workflow.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun test
      - run: bun cli/src/main.ts doctor
      - run: bun cli/src/main.ts deps verify
      - run: bun cli/src/main.ts mods check
      # Release sanitisation: no secrets, home paths or emails in published files.
      - run: bun cli/src/main.ts sanitize
      # Agent adapters smoke test: a fresh project set up for every agent reads AGENTS.md.
      - name: agent adapters smoke test
        shell: bash
        run: |
          dir="$RUNNER_TEMP/smoke" && mkdir -p "$dir" && cd "$dir" && git init -q
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" init --agents codex,cursor,gemini
          bun "$GITHUB_WORKSPACE/cli/src/main.ts" agents check --set 'agents.enabled=["claude","codex","cursor","gemini"]'

name: release
# On a pushed version tag (made by `saw release`): verify on every OS, publish a
# GitHub Release from CHANGELOG.md, then move the channel branches users install
# from: `stable` on final releases, `beta` on every release.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-*"]
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    timeout-minutes: 15
    strategy:
      matrix:
        # No Linux leg until Claude Code runs there for this workflow.
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun test
      - run: bun cli/src/main.ts release verify "$TAG"
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
      - run: bun cli/src/main.ts doctor
      - run: bun cli/src/main.ts deps verify
      - run: bun cli/src/main.ts sanitize
      # Mods are checked once the repo has them.
      - name: mods check
        shell: bash
        run: if [ -d mods ]; then bun cli/src/main.ts mods check; fi

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - name: GitHub Release
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          bun cli/src/main.ts release notes "$TAG" > "$RUNNER_TEMP/notes.md"
          pre=()
          if [[ "$TAG" == *-* ]]; then pre=(--prerelease); fi
          # Re-runnable: skip if a previous attempt already published it.
          if gh release view "$TAG" >/dev/null 2>&1; then echo "release $TAG exists"; exit 0; fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
      # Fast-forward only: a non-fast-forward push fails rather than rewriting a channel.
      - name: Move channel branches
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git push origin "refs/tags/$TAG^{commit}:refs/heads/beta"
          if [[ "$TAG" != *-* ]]; then git push origin "refs/tags/$TAG^{commit}:refs/heads/stable"; fi

name: saw
on: [pull_request]
permissions:
  contents: read
jobs:
  workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: sam-ash-cy/sams-agentic-workflow
          ref: main # pin to a release tag once one exists
          path: .saw-cli
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.11
      - run: bun .saw-cli/cli/src/main.ts doctor
      - run: bun .saw-cli/cli/src/main.ts lint-context

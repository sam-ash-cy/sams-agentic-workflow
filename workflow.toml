# This repo's own saw settings. Plugin users are unaffected.
[release]
# Cut on release/vX.Y.Z (or hotfix/*), merge into main, then `saw release tag` on main.
flow = "release-branch"

[checks]
test = "bun run test"

[verify]
allow_unconfigured = ["format", "lint", "typecheck"]
require_review_evidence = "review_session"

[review_session]
# Dogfood: a review session on standard-and-above tasks, and verify wants its evidence.
enabled = true


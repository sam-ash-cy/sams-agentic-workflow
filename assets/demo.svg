<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 424" width="900" height="424" role="img" aria-label="saw demo: a task is routed as standard, a force push is blocked by the guard, the gate refuses 'done' until the test and code review pass, then reports Verified">
<style>
text{font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.p{fill:#e6edf3;font-weight:700}.r{fill:#79c0ff}.d{fill:#9da7b3}.x{fill:#ff7b72;font-weight:700}.o{fill:#56d364;font-weight:700}
@keyframes k0{0%,4.44%{opacity:0}5.94%,94%{opacity:1}100%{opacity:0}}.l0{animation:k0 18s linear infinite}
@keyframes k1{0%,11.67%{opacity:0}13.17%,94%{opacity:1}100%{opacity:0}}.l1{animation:k1 18s linear infinite}
@keyframes k2{0%,18.89%{opacity:0}20.39%,94%{opacity:1}100%{opacity:0}}.l2{animation:k2 18s linear infinite}
@keyframes k3{0%,26.11%{opacity:0}27.61%,94%{opacity:1}100%{opacity:0}}.l3{animation:k3 18s linear infinite}
@keyframes k4{0%,33.33%{opacity:0}34.83%,94%{opacity:1}100%{opacity:0}}.l4{animation:k4 18s linear infinite}
@keyframes k5{0%,40.56%{opacity:0}42.06%,94%{opacity:1}100%{opacity:0}}.l5{animation:k5 18s linear infinite}
@keyframes k6{0%,47.78%{opacity:0}49.28%,94%{opacity:1}100%{opacity:0}}.l6{animation:k6 18s linear infinite}
@keyframes k7{0%,55.00%{opacity:0}56.50%,94%{opacity:1}100%{opacity:0}}.l7{animation:k7 18s linear infinite}
@keyframes k8{0%,62.22%{opacity:0}63.72%,94%{opacity:1}100%{opacity:0}}.l8{animation:k8 18s linear infinite}
@keyframes k9{0%,69.44%{opacity:0}70.94%,94%{opacity:1}100%{opacity:0}}.l9{animation:k9 18s linear infinite}
@keyframes k10{0%,76.67%{opacity:0}78.17%,94%{opacity:1}100%{opacity:0}}.l10{animation:k10 18s linear infinite}
</style>
<rect width="900" height="424" rx="12" fill="#0d1117"/>
<rect width="900" height="40" rx="12" fill="#161b22"/><rect y="28" width="900" height="12" fill="#161b22"/>
<circle cx="24" cy="20" r="6" fill="#ff5f57"/><circle cx="44" cy="20" r="6" fill="#febc2e"/><circle cx="64" cy="20" r="6" fill="#28c840"/>
<text x="450" y="25" text-anchor="middle" style="fill:#7d8590;font-size:13px">claude  ·  sams-agentic-workflow</text>
<text class="p l0" x="28" y="84">&gt; add rate limiting to the login endpoint</text>
<text class="r l1" x="28" y="114">router  tier=standard  playbook=feature</text>
<text class="d l2" x="28" y="144">saw task start  steps: plan, test first, implement, review, verify</text>
<text class="d l3" x="28" y="174">$ git push --force origin main</text>
<text class="x l4" x="28" y="204">guard   blocked: push needs approval (autonomy.actions.push = ask)</text>
<text class="d l5" x="28" y="234">agent   Done! Rate limiting is in.</text>
<text class="x l6" x="28" y="264">gate    not verified: missing test, code_review</text>
<text class="d l7" x="28" y="294">$ saw run test</text>
<text class="o l8" x="28" y="324">        42 passed, 0 failed</text>
<text class="d l9" x="28" y="354">$ saw task record code_review pass</text>
<text class="o l10" x="28" y="384">gate    Verified. 3/3 checks passed</text>
</svg>

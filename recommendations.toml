# MCP servers and skills saw suggests when a task needs them (features.recommend,
# features.skill_finder). Each entry: why, the install command (argv, run by
# `saw recommend add <id>`), and its triggers: prompt keywords (lowercase,
# whole-word) and project files whose presence makes it relevant. `exts` (skills)
# match the files a finished task changed.
# `installed` lists the names saw looks for in .mcp.json, ~/.claude.json and
# ~/.claude/plugins/installed_plugins.json. Nothing here stores a token: servers
# that need auth ask for it (OAuth or /mcp) after they're added.

[mcp.github]
why = "Issues, PRs, reviews and CI runs from GitHub without leaving the session."
install = ["claude", "mcp", "add", "--transport", "http", "github", "https://api.githubcopilot.com/mcp/"]
installed = ["github"]
keywords = ["github", "pull request", "pr", "issue", "issues", "ci", "workflow run", "actions"]
files = [".github"]

[mcp.figma]
why = "Reads frames, components and variables from Figma files for design-to-code work."
install = ["claude", "mcp", "add", "--transport", "http", "figma", "https://mcp.figma.com/mcp"]
installed = ["figma"]
keywords = ["figma", "mockup", "design file", "frame", "frames", "prototype"]
files = []

[mcp.context7]
why = "Current library and framework docs, so code isn't written against stale APIs."
install = ["claude", "mcp", "add", "--transport", "http", "context7", "https://mcp.context7.com/mcp"]
installed = ["context7"]
keywords = ["docs", "documentation", "upgrade", "migrate", "library", "framework", "sdk"]
files = []

[mcp.playwright]
why = "Drives a real browser for end-to-end tests and UI checks."
install = ["claude", "mcp", "add", "playwright", "--", "npx", "-y", "@playwright/mcp@latest"]
installed = ["playwright"]
keywords = ["e2e", "end-to-end", "browser", "playwright", "screenshot"]
files = ["playwright.config.ts", "playwright.config.js"]

[mcp.chrome-devtools]
why = "Console, network, performance traces and Lighthouse from a live Chrome page."
install = ["claude", "mcp", "add", "chrome-devtools", "--", "npx", "-y", "chrome-devtools-mcp@latest"]
installed = ["chrome-devtools"]
keywords = ["performance", "lighthouse", "console", "network", "slow page", "core web vitals", "devtools"]
files = []

[mcp.sentry]
why = "Production errors and stack traces from Sentry while debugging."
install = ["claude", "mcp", "add", "--transport", "http", "sentry", "https://mcp.sentry.dev/mcp"]
installed = ["sentry"]
keywords = ["sentry", "production error", "stack trace", "crash", "exception"]
files = ["sentry.client.config.ts", "sentry.server.config.ts", ".sentryclirc"]

